services:
  db:
    image: postgres:16-alpine
    container_name: ai-series-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_series}
      POSTGRES_USER: ${POSTGRES_USER:-ai_series}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_series} -d ${POSTGRES_DB:-ai_series}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ai-series-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_series}:${POSTGRES_PASSWORD:-change_me_locally}@db:5432/${POSTGRES_DB:-ai_series}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./storage/books:/app/storage/books

  worker:
    build:
      context: ./backend
    # без container_name: можно масштабировать `docker compose up -d --scale worker=2`
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_series}:${POSTGRES_PASSWORD:-change_me_locally}@db:5432/${POSTGRES_DB:-ai_series}
    command: ["python", "-m", "app.worker"]
    # миграции применяет backend; воркер ждёт появления таблиц сам
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    # SIGTERM -> воркер доделывает текущий фрагмент (LLM timeout 120s)
    stop_grace_period: 150s
    volumes:
      - ./backend:/app
      - ./storage/books:/app/storage/books

  frontend:
    build:
      context: ./frontend
    container_name: ai-series-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
